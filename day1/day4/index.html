<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Day 4 Dynamic UI</title>
    <link rel="stylesheet" href="style.css" />
</head>
  <body>
    <header>
        <h1>QuickNotes</h1>
          <p>Capture ideas before they disappear.</p>
  </header>

<main>
  <section>
    <h2>Add a note</h2>
      <form id="note-form">
      <label for="note-input">New note:</label>
    <input type="text" id="note-input" placeholder="Type a note..." required />
    <button type="submit">Add Note</button>
</form>
</section>

  <section>
    <h2>Your notes</h2>
    <p id="note-count">You have 0 notes.</p>
<!-- Empty list; JavaScript will dynamically create <li> items here -->
<ul id="notes-list"></ul>
</section>
</main>

<footer>
  <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
</footer>

<!-- Script linked at the bottom with defer -->
<script src="script.js" defer></script>
  </body>
</html>
